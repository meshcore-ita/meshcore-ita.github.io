name: Check

# Stesso gate di pages.yml, ma prima del merge: una PR che tocca content/ o
# templates/ senza rigenerare i file non arriva su main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # SITE_BASE esplicito: nelle PR da fork GITHUB_REPOSITORY è il fork, e
      # il confronto fallirebbe su URL assoluti che non c'entrano.
      - name: Verify generated pages match content/
        env:
          SITE_BASE: https://meshcore-ita.github.io/
        run: node build.mjs --check
