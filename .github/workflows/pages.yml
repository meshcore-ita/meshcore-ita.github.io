name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # serve lo storico per diffare i due sha del push e capire
          # quali pagine sono cambiate davvero
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # GITHUB_REPOSITORY is a default env var GitHub Actions sets on every
      # step (no explicit `env:` needed); build.mjs resolves SITE_BASE from
      # it, so this always checks against the same absolute-URL base this
      # repo publishes at. `--check` is a hard gate, not a rebuild-and-hope:
      # if content/templates changed without regenerating <slug>/index.html,
      # sitemap.xml, robots.txt or 404.html, the job fails here and nothing
      # below deploys — stale generated pages can never reach production.
      - name: Verify generated pages match content/
        run: node build.mjs --check
      # Si pubblica solo il sito: sorgenti, script del bot, configurazione del
      # Worker e metadati di repo non hanno motivo di finire online.
      - name: Stage public site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude 'bot' \
            --exclude 'worker' \
            --exclude 'scripts' \
            --exclude 'content' \
            --exclude 'templates' \
            --exclude 'build.mjs' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '*.md' \
            ./ _site/
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Notifica IndexNow (Bing, Yandex, Seznam, Naver) delle sole pagine
      # cambiate in questo push. Gira dopo il deploy: le URL devono essere
      # già raggiungibili quando i motori vengono a leggerle. Non fallisce
      # il job: un deploy riuscito non si annulla per una notifica persa.
      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
      # Annuncia nel topic Annunci del gruppo Telegram i post del blog
      # aggiunti da questo push. Come sopra: dopo il deploy, e senza far
      # fallire il job. Senza il secret lo script esce 0 e non fa nulla; chat
      # e topic Annunci (15) sono i default, sovrascrivibili con le variabili
      # TELEGRAM_CHAT_ID e TELEGRAM_ANNOUNCE_TOPIC_ID del repo.
      - name: Announce new blog posts on Telegram
        if: github.event_name == 'push' && github.run_attempt == 1
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_ANNOUNCE_TOPIC_ID: ${{ vars.TELEGRAM_ANNOUNCE_TOPIC_ID }}
        run: node scripts/announce-post.mjs "${{ github.event.before }}" "${{ github.sha }}"
