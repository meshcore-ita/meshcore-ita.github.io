name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # serve lo storico per diffare i due sha del push e capire
          # quali pagine sono cambiate davvero
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # GITHUB_REPOSITORY is a default env var GitHub Actions sets on every
      # step (no explicit `env:` needed); build.mjs resolves SITE_BASE from
      # it, so this always checks against the same absolute-URL base this
      # repo publishes at. `--check` is a hard gate, not a rebuild-and-hope:
      # if content/templates changed without regenerating <slug>/index.html,
      # sitemap.xml, robots.txt or 404.html, the job fails here and nothing
      # below deploys — stale generated pages can never reach production.
      - name: Verify generated pages match content/
        run: node build.mjs --check
      # L'artifact carica l'intera root del repo: node_modules non deve
      # finire in produzione, build.mjs l'ha già usato e basta.
      - name: Remove node_modules from artifact
        run: rm -rf node_modules
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Notifica IndexNow (Bing, Yandex, Seznam, Naver) delle sole pagine
      # cambiate in questo push. Gira dopo il deploy: le URL devono essere
      # già raggiungibili quando i motori vengono a leggerle. Non fallisce
      # il job: un deploy riuscito non si annulla per una notifica persa.
      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
