name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # serve lo storico per diffare i due sha del push e capire
          # quali pagine sono cambiate davvero
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # GITHUB_REPOSITORY is a default env var GitHub Actions sets on every
      # step (no explicit `env:` needed); build.mjs resolves SITE_BASE from
      # it, so this always checks against the same absolute-URL base this
      # repo publishes at. `--check` is a hard gate, not a rebuild-and-hope:
      # if content/templates changed without regenerating <slug>/index.html,
      # sitemap.xml, robots.txt or 404.html, the job fails here and nothing
      # below deploys — stale generated pages can never reach production.
      - name: Verify generated pages match content/
        run: node build.mjs --check
      # Si pubblica solo il sito: sorgenti, script del bot, configurazione del
      # Worker e metadati di repo non hanno motivo di finire online.
      - name: Stage public site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude 'bot' \
            --exclude 'worker' \
            --exclude 'scripts' \
            --exclude 'content' \
            --exclude 'templates' \
            --exclude 'build.mjs' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '*.md' \
            ./ _site/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # Notifica IndexNow (Bing, Yandex, Seznam, Naver) delle sole pagine
      # cambiate in questo push. Gira dopo il deploy: le URL devono essere
      # già raggiungibili quando i motori vengono a leggerle. Non fallisce
      # il job: un deploy riuscito non si annulla per una notifica persa.
      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
